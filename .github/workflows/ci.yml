name: GHARAR Flutter CI

on:
  push:
    branches: [ main, 'feature/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze --fatal-infos

      - name: Run All Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage
          path: coverage/lcov.info

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Test Firestore Security Rules
        run: npm test

  # Windows can't build iOS; this proves the iPhone app compiles on macOS.
  # Unsigned: installing on a phone needs an Apple Developer signing setup.
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Upload Unsigned App
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app-unsigned
          path: build/ios/iphoneos/Runner.app
