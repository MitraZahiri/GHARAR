name: gharar
description: "GHARAR - a private sanctuary for couples, near or far."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  qr_flutter: ^4.1.0
  home_widget: ^0.9.2+1
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  firebase_core: 4.10.0
  # Must match firebase_core's native side; 7.1.0 adds a field 4.10.0
  # doesn't send and crashes Firebase.initializeApp on Android.
  firebase_core_platform_interface: 7.0.1
  firebase_auth: 6.5.2
  cloud_firestore: 6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ">=4.1.1 <4.2.0"
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
